<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gutschein sichern</title>
  <meta name="description" content="Gutscheine für deutsche Geschäfte, von 200 € bis 1.000 €. Bestätigung: 18 Jahre oder älter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e30613;
      --red-dark: #b0040e;
      --ink: #141414;
      --paper: #f6f4f2;
      --yellow: #ffe500;
      --font: "Archivo", Arial, Helvetica, sans-serif;
      --narrow: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
      --head: calc(60px + env(safe-area-inset-top));
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -80px, rgba(227, 6, 19, 0.16), transparent 70%),
        var(--paper);
      font-family: var(--font);
      font-size: 1.0625rem;
      line-height: 1.45;
      overflow-x: hidden;
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -48px;
      background: #fff;
      color: #000;
      padding: 8px 12px;
      border-radius: 999px;
      z-index: 80;
    }

    .skip:focus { top: 12px; }

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: var(--head);
      padding: env(safe-area-inset-top) 18px 0;
      background: var(--red);
      color: #fff;
    }

    .bar strong {
      font-family: var(--narrow);
      font-weight: 700;
      font-size: clamp(1.35rem, 5vw, 1.7rem);
      letter-spacing: 0.12em;
    }

    .bar span {
      background: var(--yellow);
      color: #141414;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      padding: 7px 12px;
      border-radius: 999px;
    }

    main {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: calc(var(--head) + 18px) 16px 32px;
    }

    .banner {
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 22px 20px 18px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #ff2a24 0%, var(--red) 46%, #9d0410 100%);
      color: #fff;
      box-shadow: 0 18px 40px rgba(227, 6, 19, 0.28);
      animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .banner::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 38%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      animation: sheen 4.2s ease-in-out infinite;
      pointer-events: none;
    }

    .banner-kicker {
      position: relative;
      margin: 0 0 4px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .banner h2 {
      position: relative;
      margin: 0 0 14px;
      color: #fff;
      font-size: clamp(2rem, 8vw, 3.4rem);
    }

    .prizes {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .prize {
      background: #fff;
      color: var(--ink);
      border-radius: 22px;
      text-align: center;
      padding: 14px 8px 12px;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .prize:nth-child(1) { animation-delay: 0.12s; }
    .prize:nth-child(2) { animation-delay: 0.22s; }
    .prize:nth-child(3) { animation-delay: 0.32s; }

    .prize b {
      display: block;
      font-family: var(--narrow);
      font-weight: 700;
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      line-height: 0.9;
      color: var(--red);
      animation: float 3.2s ease-in-out infinite;
    }

    .prize:nth-child(2) b { animation-delay: 0.4s; }
    .prize:nth-child(3) b { animation-delay: 0.8s; }

    .prize span {
      display: block;
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .offer,
    .terms {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 14px 36px rgba(20, 20, 20, 0.08);
      animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .offer {
      position: relative;
      padding: 24px 20px 20px;
      animation-delay: 0.08s;
    }

    .badge {
      display: inline-block;
      margin: 0 0 12px;
      background: var(--yellow);
      color: #141414;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      padding: 7px 12px;
      border-radius: 999px;
    }

    h1, h2 {
      font-family: var(--narrow);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.03em;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 10vw, 4.4rem);
    }

    h2 { margin: 0; }

    .ends {
      margin: 0 0 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .clock {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .cell {
      background: #fff7f7;
      border-radius: 22px;
      text-align: center;
      padding: 16px 6px 12px;
    }

    .cell b {
      display: block;
      font-family: var(--narrow);
      font-weight: 700;
      font-size: clamp(2.2rem, 11vw, 4.6rem);
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      color: var(--red);
    }

    .cell span {
      display: block;
      margin-top: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .note {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .terms {
      margin-top: 14px;
      padding: 20px;
      animation-delay: 0.16s;
    }

    .terms h2 {
      margin-bottom: 8px;
      font-size: clamp(1.6rem, 6vw, 2rem);
    }

    .terms p {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .actions {
      margin-top: 16px;
    }

    .actions p {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    #status {
      margin: 10px 0 0;
      min-height: 0;
      font-weight: 700;
    }

    #status:empty { display: none; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 12px 26px;
      background: var(--red);
      color: #fff;
      border-radius: 999px;
      box-shadow: 0 10px 22px rgba(227, 6, 19, 0.32);
      font-family: var(--narrow);
      font-weight: 700;
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      letter-spacing: 0.02em;
      text-decoration: none;
      text-align: center;
    }

    .cta:hover { background: var(--red-dark); }

    .cta:focus-visible,
    .skip:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes sheen {
      0% { transform: translateX(-120%); }
      55%, 100% { transform: translateX(320%); }
    }

    @media (max-width: 640px) {
      main { padding-left: 12px; padding-right: 12px; }

      .prizes { gap: 8px; }

      .prize { padding: 12px 4px 10px; border-radius: 18px; }

      .cell { border-radius: 18px; padding: 12px 4px 10px; }

      .offer, .terms, .banner { border-radius: 22px; }
    }

    @media (max-width: 380px) {
      .prizes { grid-template-columns: 1fr; }

      .prize {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        text-align: left;
        padding: 12px 16px;
      }

      .prize span { margin-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner,
      .prize,
      .offer,
      .terms,
      .prize b,
      .banner::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#inhalt">Zum Inhalt</a>
  <header class="bar">
    <strong>Kaufland</strong>
    
  </header>

  <main id="inhalt">
    <section class="banner" aria-label="Gutscheine für deutsche Geschäfte">
      <p class="banner-kicker"></p>
      <h2></h2>
      <div class="prizes">
        <article class="prize"><b>200 €</b><span>Supermarkt</span></article>
        <article class="prize"><b>500 €</b><span>Drogerie</span></article>
        <article class="prize"><b>1.000 €</b><span>Kaufhaus</span></article>
      </div>
    </section>

    <section class="offer">
      <p class="badge">NUR JETZT</p>
      <h1 id="titel">Gutschein sichern</h1>
      <p class="ends" id="ends">Aktion endet in</p>
      <div class="clock" role="timer" aria-labelledby="ends">
        <div class="cell"><b id="hh">05</b><span>Stunden</span></div>
        <div class="cell"><b id="mm">00</b><span>Minuten</span></div>
        <div class="cell"><b id="ss">00</b><span>Sekunden</span></div>
      </div>
      <p class="note" id="rest" aria-live="polite">Aktion läuft.</p>
      <div class="actions">
        <p>Bedingung: Alter bestätigen, 18 oder älter.</p>
        <a class="cta" id="cta" href="#">Jetzt bestätigen</a>
        <p id="status" role="status"></p>
      </div>
    </section>
  </main>

  <script>
    // Сюда вставьте ссылку на проверку 18+. Пока пусто — кнопка не уводит со страницы.
    const COUPON_URL = "https://25-2160.com/a0c7221e6be751e0debcfeeb4ececfee";

    const KEY = "aktion-gutschein-start";
    const WAIT = 5 * 60 * 60 * 1000;

    let start = 0;
    try {
      start = Number(localStorage.getItem(KEY));
      if (!start) {
        start = Date.now();
        localStorage.setItem(KEY, String(start));
      }
    } catch (err) {
      start = Date.now();
    }

    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const rest = document.getElementById("rest");
    const ends = document.getElementById("ends");
    const cta = document.getElementById("cta");
    const status = document.getElementById("status");
    let lastSpoken = "";

    if (COUPON_URL) cta.href = COUPON_URL;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function left() {
      return Math.max(0, WAIT - (Date.now() - start));
    }

    function paint() {
      const ms = left();
      const total = Math.ceil(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      hh.textContent = pad(h);
      mm.textContent = pad(m);
      ss.textContent = pad(s);
      if (ms === 0) ends.textContent = "Aktion beendet";
      const spoken = ms === 0
        ? "Die Aktion ist beendet."
        : "Noch " + h + " Stunden und " + m + " Minuten.";
      if (spoken !== lastSpoken) {
        rest.textContent = spoken;
        lastSpoken = spoken;
      }
    }

    paint();
    setInterval(paint, 1000);

    cta.addEventListener("click", function (event) {
      if (!COUPON_URL) {
        event.preventDefault();
        status.textContent = "Die Adresse ist noch nicht eingetragen.";
      }
    });
  </script>
</body>
</html>
